[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terra-scientific"
version = "0.1.0"
description = "Scientific computation core for PROJECT TERRA"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
geospatial = [
    "pyproj>=3.7.0",
    "rasterio>=1.4.0",
    "rioxarray>=0.18.0",
    "shapely>=2.0.0",
    "xarray>=2024.10.0",
]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terra_scientific"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = false
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "rasterio.*",
    "rioxarray.*",
    "shapely.*",
    "pyproj.*",
    "xarray.*",
]
ignore_missing_imports = true
