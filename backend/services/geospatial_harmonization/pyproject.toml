[project]
name = "geospatial-harmonization"
version = "0.1.0"
description = "TERRA Geospatial Harmonization Service — source-agnostic geospatial ingestion and transformation."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "fastapi>=0.162.0",
    "granian>=2.8.0",
    "h5py>=3.12.0",
    "httpx>=0.28.0",
    "netcdf4>=1.7.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.16.0",
    "pyhdf>=0.11.6",
    "pyproj>=3.7.0",
    "rasterio>=1.4.0",
    "rioxarray>=0.18.0",
    "shapely>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "xarray>=2024.10.0",
    "zarr>=3.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geospatial_harmonization"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["geospatial_harmonization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: optional live NASA provider smoke tests requiring RUN_LIVE_NASA_TESTS=1",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["geospatial_harmonization"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["h5py.*", "netCDF4.*", "pyhdf.*", "rasterio.*", "rioxarray.*", "boto3.*"]
ignore_missing_imports = true
