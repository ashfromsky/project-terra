[project]
name = "terra-core"
version = "0.1.0"
description = "TERRA core API — FastAPI application served by Granian."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.162.0",
    "granian>=2.8.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "terra-scientific>=0.1.0",
]

[tool.uv.sources]
terra-scientific = { path = "../scientific", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terra"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["terra", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["terra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
